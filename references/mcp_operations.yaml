  "runtime_enforcement": {
    "pi": "The adapter approval broker and Pi tool_call trust all classified Serena operations plus other classified safe operations. The top-level mcp gateway requires an explicit managed server and matching tool name; conditional tools also require validated arguments. In planner mode, only cached status, server listing, search, describe, and instructions selectors are permitted; managed execution is restricted to policy-classified read-only or validated conditional-read tools, with the stricter Serena read boundary and no Playwright. Outside planner mode, mcpScript permits tools.search/tools.describe metadata and nested tools.call retains normal policy. It is blocked in planner mode: adapter session approvals are checked before the broker, so nested-call policy cannot be guaranteed across role changes. Auth, lifecycle, UI actions, selector mixtures, unclassified tools, unmanaged servers, and local/external mutations remain blocked. Validation requires runtime safe sets to match this policy."
  }
