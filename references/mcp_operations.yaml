{
  "schema_version": 1,
  "format": "json-subset-of-yaml",
  "description": "Canonical managed MCP operation classification. All Serena operations plus classified read-only and safe conditional-read operations are auto-approved through adapter-owned calls and unambiguous top-level mcp gateway calls. Planner mode permits only cached non-executing MCP status, server listing, search, describe, and instructions metadata, plus policy-classified managed read-only or validated conditional-read execution (excluding Playwright and Serena mutations); mcpScript is blocked because adapter session approvals could bypass the planner broker.",
  "classes": {
    "read-only": {
      "policy": "Auto-approved for managed servers",
      "notes": "Managed observations; gateway calls require an explicit server and matching classified tool."
    },
    "conditional-read": {
      "policy": "Auto-approved for safe arguments",
      "notes": "Gate mutation, local access, and arbitrary output."
    },
    "trusted-serena": {
      "policy": "Auto-approved for Serena",
      "notes": "Serena lifecycle tools; intended-purpose use only."
    },
    "conditional-local": {
      "policy": "Auto-approved inside current project",
      "notes": "Repo-confined Serena code edits; unsafe paths stay gated."
    },
    "local-upload": {
      "policy": "Approval required",
      "notes": "Reads local files for remote processing."
    },
    "external-mutation": {
      "policy": "Approval required",
      "notes": "Creates or changes remote state (sessions, pages, feedback)."
    },
    "monitor-lifecycle": {
      "policy": "Approval required",
      "notes": "Firecrawl monitor create/update/delete/run/list/get/check."
    },
    "local-mutation": {
      "policy": "Approval required",
      "notes": "Mutates local repository or agent state."
    },
    "auth": {
      "policy": "Approval required",
      "notes": "MCP OAuth/auth bootstrap."
    }
  },
